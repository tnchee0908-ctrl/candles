name: candles

# Один образ бэкенда на четыре сервиса (API, воркер, два мока): собирается один раз.
x-backend-image: &backend-image
  image: candles-backend:local
  pull_policy: never
  restart: unless-stopped

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://candles:candles@db:5432/candles
  TEST_DATABASE_URL: postgresql+asyncpg://candles:candles@db:5432/candles_test
  REDIS_URL: redis://redis:6379/0
  RATES_SERVICE_URL: http://rates-mock:8101
  MARKING_SERVICE_URL: http://marking-mock:8102
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL:-gpt-4.1-mini}
  LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-gpt-4o-mini}
  LLM_JUDGE_MODEL: ${LLM_JUDGE_MODEL:-gpt-4o}
  LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-300}
  LLM_IDLE_TIMEOUT_S: ${LLM_IDLE_TIMEOUT_S:-90}
  # Пусто — бэкенд сгенерирует случайный секрет при старте (вход сбросится после перезапуска).
  JWT_SECRET: ${JWT_SECRET:-}
  CHAT_USER_HOURLY_LIMIT: ${CHAT_USER_HOURLY_LIMIT:-0}
  CHAT_DAILY_LIMIT: ${CHAT_DAILY_LIMIT:-0}

# Порты публикуются только на localhost: снаружи машины к API и мокам не подключиться.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Журнал PostgreSQL без DETAIL и текста запроса: там бывают значения строк (ФИО, поставщики).
    command: ["postgres", "-c", "log_error_verbosity=terse", "-c", "log_min_error_statement=panic"]
    environment:
      POSTGRES_USER: candles
      POSTGRES_PASSWORD: candles
      POSTGRES_DB: candles
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U candles -d candles"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  backend:
    <<: *backend-image
    build:
      context: ./backend
      target: runtime
    environment: *backend-env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      rates-mock: { condition: service_started }
      marking-mock: { condition: service_started }
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - ./backend/eval/reports:/app/eval/reports
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 3s
      retries: 40

  rates-mock:
    <<: *backend-image
    command: uvicorn mocks.rates:app --host 0.0.0.0 --port 8101
    ports: ["127.0.0.1:8101:8101"]

  marking-mock:
    <<: *backend-image
    command: uvicorn mocks.marking:app --host 0.0.0.0 --port 8102
    environment:
      MARKING_FAILURE_RATE: ${MARKING_FAILURE_RATE:-0.3}
      MARKING_SLOW_RATE: ${MARKING_SLOW_RATE:-0.1}
      MARKING_SLOW_SECONDS: ${MARKING_SLOW_SECONDS:-10}
    ports: ["127.0.0.1:8102:8102"]

  worker:
    <<: *backend-image
    command: arq app.worker.WorkerSettings
    environment: *backend-env
    depends_on:
      backend: { condition: service_healthy }

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    ports: ["127.0.0.1:8080:80"]

  # Тесты — отдельный образ (runtime + dev-зависимости + tests/), в рабочие образы они не попадают.
  # Запуск: docker compose run --rm tests
  tests:
    build:
      context: ./backend
      target: test
    image: candles-backend-tests:local
    profiles: ["test"]
    environment: *backend-env
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
