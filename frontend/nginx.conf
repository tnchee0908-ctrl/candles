# Журнал без параметров запроса: в ?supplier=… и подобных бывают ПДн ($uri — путь без query string).
log_format no_query '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent $request_time';

server {
  listen 80;
  access_log /var/log/nginx/access.log no_query;
  root /usr/share/nginx/html;
  client_max_body_size 10m;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # SSE: без буферизации, иначе ответ ассистента придёт целиком в конце.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }

  location ~ ^/(docs|openapi.json) {
    proxy_pass http://backend:8000;
  }

  location / {
    try_files $uri /index.html;
  }
}
