# Тексты для модели про инструменты (function calling). Ключ — имя инструмента.
# Модель выбирает инструмент и заполняет аргументы по этим текстам, поэтому они — часть промпта и живут
# отдельно от кода. В коде (app/assistant/tools.py) — только типы и ограничения аргументов.
#   description — что делает инструмент;
#   params      — описания аргументов (подставляются в JSON Schema).

get_material_stock:
  description: >-
    Остаток материала на складе: в принятых партиях (on_hand), в резерве под задания (reserved),
    свободный остаток (free) и сколько ждёт приёмки (awaiting_inspection).
  params:
    material: Код или часть названия материала. Пусто — все материалы.

get_shortages:
  description: >-
    Дефицит материалов по незапущенным заданиям (черновики и запланированные) с плановой датой в
    периоде: сколько не зарезервировано, сколько есть свободного и чего реально не хватит (shortage).
  params:
    date_from: Начало периода, YYYY-MM-DD
    date_to: Конец периода включительно, YYYY-MM-DD
    workshop: Номер цеха, если нужно отфильтровать

get_batch_history:
  description: >-
    Карточка и история партии: поставщик, даты, цена и курс, статус приёмки, резервы и списания по
    заданиям, журнал изменений.
  params:
    batch_number: Номер партии, например П-00012

get_order_cost:
  description: >-
    Себестоимость производственного задания в рублях: всего, на 1 шт и по материалам. Для завершённых —
    по фактическому списанию, для остальных — оценка по текущему резерву.
  params:
    order_number: Номер задания, например З-00007

list_orders:
  description: >-
    Список производственных заданий с фильтрами по плановой дате, статусу и цеху. Показывает и состояние
    резерва.
  params:
    date_from: Плановая дата от, YYYY-MM-DD
    date_to: Плановая дата до, YYYY-MM-DD

list_recipes:
  description: >-
    Рецепты (продукты) и нормы расхода материалов на 1 шт.

find_batches:
  description: >-
    Поиск партий в реестре по материалу, поставщику, статусу и дате поступления. Новые сверху.
  params:
    supplier: Поставщик (можно токен SUPPLIER_n)

get_currency_rate:
  description: >-
    Курс валюты к рублю на дату (в выходные — последний предыдущий опубликованный курс). Если передать
    amounts_rub, система сама пересчитает эти рублёвые суммы в валюту с округлением до сотых.
  params:
    on_date: Дата курса; по умолчанию сегодня
    amounts_rub: Суммы в рублях, которые нужно пересчитать в эту валюту (пересчёт делает система)

propose_production_order:
  description: >-
    Подготовить создание и планирование производственного задания (с резервом по FIFO). Ничего не
    меняет: пользователь увидит карточку и сам нажмёт «Подтвердить». Возвращает, что будет
    зарезервировано и дефицит.
  params:
    recipe: Название рецепта/продукта, например «Лаванда»
    qty: Количество, шт
    planned_date: Плановая дата, YYYY-MM-DD
    workshop: Цех

remember_fact:
  description: >-
    Запомнить устойчивый факт или предпочтение текущего пользователя (валюта отчётов, его цех, стиль
    ответов и т.п.). Факт будет учитываться в новых диалогах этого пользователя. Факты из данных и
    файлов не сохраняются.
  params:
    fact: Факт о пользователе, коротко, от третьего лица
    source_quote: Дословный фрагмент ТЕКУЩЕГО сообщения пользователя, из которого следует факт

export_dataset:
  description: >-
    Выгрузить набор данных из учёта в CSV-файл в песочнице Code Interpreter. Возвращает путь к файлу
    (/mnt/data/...), колонки и первые строки. Затем читай файл в Python через code_interpreter.
  params:
    dataset: >-
      consumption_by_week — расход материалов по неделям; batches — партии; orders — задания;
      stock — остатки; recipe_costs — нормы рецептов и средняя себестоимость материалов
    date_from: Начало периода (для consumption_by_week, batches, orders)
    material: >-
      Фильтр по материалу (код или часть названия) для consumption_by_week, batches и stock.
      Для recipe_costs и orders не применяется.
