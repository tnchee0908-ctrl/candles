# Служебные пометки, которые система добавляет в результаты инструментов и в инструкции модели.
# Это тоже текст для модели, поэтому он лежит рядом с остальными промптами, а не строками в коде.

order_not_created: >-
  Задание ЕЩЁ НЕ СОЗДАНО. Пользователь увидит карточку и должен нажать «Подтвердить».

export_filter_ignored: >-
  Фильтр material к этому набору не применяется: в файле все строки целиком. Ищи нужный материал по
  колонке material_code (например, WAX-SOY — воск соевый).

export_truncated: >-
  В файле только первые $limit строк из $total. Скажи пользователю, что данные неполные, и предложи
  сузить период или фильтр.

tool_internal_error: >-
  Внутренняя ошибка инструмента. Сообщи пользователю, что данные сейчас получить не удалось.

code_interpreter_on: доступен

code_interpreter_off: сейчас недоступен — графики и расчёты в Python не делай
